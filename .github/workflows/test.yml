# PyOS NOVA — Continuous Integration
# =====================================
# Runs on every push and pull request.
# Three parallel jobs: syntax check, lint, full test suite.

name: Tests

on:
  push:
    branches: [main, dev, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: Python syntax check (fast gate) ──────────────────────────────────
  syntax:
    name: Syntax check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all Python files
        run: |
          python3 -m compileall . -q
          echo "Syntax check complete"

  # ── Job 2: Lint with ruff ────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --select E,F,W,I --ignore E501,E731 --output-format=github

  # ── Job 3: Full test suite ───────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        os:             [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install NOVA + test dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio pytest-cov psutil numpy

      - name: Run test suite
        run: |
          pytest tests/ -v --tb=short \
            --timeout=30 \
            --ignore=tests/bench.py \
            --cov=. --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q
        env:
          NOVA_NO_AI: "1"     # disable LLM in CI (no GPU, no model files)
          NOVA_DATA:  /tmp/nova_ci_data

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Job 4: Module docstring coverage ────────────────────────────────────────
  docstrings:
    name: Docstring coverage (100%)
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Check 100% module-level docstring coverage
        run: |
          python3 - << 'PYEOF'
          import ast, os, sys

          missing = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs
                         if d not in ("__pycache__", ".git", ".venv", "dist")]
              for fname in files:
                  if not fname.endswith(".py"):
                      continue
                  path = os.path.join(root, fname)
                  try:
                      tree = ast.parse(open(path).read())
                      if not ast.get_docstring(tree):
                          missing.append(path)
                  except SyntaxError:
                      pass   # already caught by syntax job

          total = sum(1 for r, d, fs in os.walk(".")
                      for f in fs if f.endswith(".py")
                      and "__pycache__" not in r)
          pct   = round((1 - len(missing) / max(total, 1)) * 100, 1)
          print(f"Module docstring coverage: {pct}%  ({total - len(missing)}/{total})")

          if missing:
              print("\nFiles missing module docstrings:")
              for m in missing:
                  print(f"  {m}")
              sys.exit(1)
          PYEOF
