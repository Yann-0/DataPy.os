[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapy-os"
version = "0.0.8"
description = "Python-native operating system — Python is PID-1"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
datapy = "main:main"

[tool.setuptools]
py-modules = ["main"]
# Explicit discovery avoids flat-layout rejection and excludes tests/build outputs.
packages = [
    "ai", "apps", "boot", "build", "i18n", "kernel", "net", "plugins",
    "rpi", "runtime", "search", "security", "shell", "store", "system", "tags",
]

[tool.setuptools.package-data]
boot = ["*.c"]
build = ["*.sh"]

[project.optional-dependencies]
ai       = ["llama-cpp-python", "numpy"]
search   = ["numpy"]
ssh      = ["paramiko"]
compress = ["zstandard", "lz4"]
i18n     = ["argostranslate"]
rpi      = ["gpiod", "smbus2"]
dev      = ["pytest", "pytest-asyncio", "pytest-cov", "pytest-timeout", "ruff", "psutil", "numpy"]
full     = ["datapy-os[ai,search,ssh,compress,i18n]"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
